name: ci

on: [push, pull_request]

permissions:
  contents: read
  pull-requests: read

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    name: Markdownlint
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Markdownlint
        uses: nosborn/github-action-markdown-cli@85611bef0da53168168939754ff9d8f6073a8fec
        with:
          files: "*.md"
          config_file: .markdownlint.json

  check_format:
    runs-on: ubuntu-latest
    name: Check format
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Check format
        run: python3 check_format.py
